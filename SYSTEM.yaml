# This file declares the repository boundary and its place in the GitHub estate.
schema_version: 1
id: research.poverty.model
repository:
  id: repo.indice-pobreza-uba
  github: matuteiglesias/indice-pobreza-UBA
domain: research
system: research.poverty
role: poverty-measurement-consumer
lifecycle: active
authority:
  status: approved
  owns:
  - project-specific poverty methodology and classification
  - adult-equivalence and threshold-comparison policy as approved by the project
  - poverty/indigence gaps, permitted estimands and aggregation of classified units
  - governed poverty releases and their QA/limitations
  does_not_own:
  - official poverty statistics
  - Census sampling or Census geography authority
  - raw EPH or Census acquisition
  - EPH-to-Census semantic alignment
  - income model training, model selection or Census scoring execution
  - public documentation deployment
interfaces:
  consumes:
  # Direct, content-locked inputs to a poverty run.
  - artifact:research.census-sample@1
  - artifact:research.person-income-predictions@1
  - artifact:research.poverty-adult-equivalence@1
  - artifact:research.regional-baskets@1
  # EPH, semantic alignment and model/scoring execution are upstream lineage of
  # the prediction release. They are not opened or executed by the poverty runner.
  upstream_lineage:
  - artifact:research.eph-annual-input@1
  - artifact:research.eph-model-execution@1
  - artifact:research.eph-census-crosswalk@1
  produces:
  - artifact:research.poverty-output@1
  - artifact:research.poverty-method@1
upstream:
- repo.sampler-censo-arg
- repo.canastasindec
- repo.income-modeling-eph
# repo.eph-censo-aligner is lineage through prediction production, not a direct
# runtime dependency of a poverty release.
downstream:
- repo.atlas-site
canonical_commands:
- name: produce-versioned-poverty-release
  command: PYTHONPATH=src python -m poverty_pipeline run-lock <poverty-slice-lock/v1-path>
  input: poverty-slice-lock/v1
  output: <lock.outputs.release_root>/<lock.slice_id>/<lock.outputs.release_version>/
generated_paths:
- artifacts/
- figures/
verification:
  status: contract-defined
  last_verified: '2026-08-04'
  command: PYTHONPATH=src python -m poverty_pipeline run-lock <poverty-slice-lock/v1-path>
  unknowns:
  - production release IDs and approval record IDs are supplied by each approved slice lock
maintenance:
  cadence: quarterly
  next_review: '2026-11-01'
