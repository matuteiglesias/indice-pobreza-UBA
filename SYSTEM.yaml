# This file declares the repository boundary and its place in the GitHub estate.
schema_version: 1
id: research.poverty.estimation
repository:
  id: repo.indice-pobreza-uba
  github: matuteiglesias/indice-pobreza-UBA
domain: research
system: research.poverty
role: poverty-measurement-estimation-authority
lifecycle: active
authority:
  status: current
  owns:
  - versioned project poverty methodology and adult-equivalence semantics
  - household poverty/indigence threshold construction and FGT measurement
  - weighted poverty estimands over already-governed frame/design inputs
  - propagation of justified upstream uncertainty representations when available
  - governed poverty estimate releases, capabilities, QA and limitations
  does_not_own:
  - official INDEC poverty publication
  - Census acquisition, sampling or geography authority
  - raw EPH acquisition or EPH geography
  - EPH-to-Census semantic alignment
  - income model training, promotion or Census scoring execution
  - poverty-line source acquisition/price-series production
  - geometry, spatial joins, Mapbox transport or public atlas rendering
interfaces:
  v2_scientific_boundary:
    consumes:
    - contract:population-frame
    - contract:deployable-household-welfare
    - artifact:research.poverty-method@1
    - contract:poverty-lines
    - contract:threshold-area-binding
    produces:
    - artifact:poverty-estimate-release@2
    output_roles:
    - poverty_estimates.csv
    - capabilities.json
    - geography_join_contract.json
    - release_manifest.json
    - run_qa.json
    - LIMITATIONS.md
    - checksums.sha256
  legacy_v1_runtime:
    status: compatibility-only
    consumes:
    - artifact:research.census-sample@1
    - artifact:research.person-income-predictions@1
    - artifact:research.poverty-adult-equivalence@1
    - artifact:research.regional-baskets@1
    produces:
    - artifact:research.poverty-output@1
upstream:
- repo.sampler-censo-arg
- repo.canastasindec
- repo.income-modeling-eph
- repo.encuestador-de-hogares
- repo.argentina-geography
downstream:
- repo.argentina-poverty-atlas
canonical_commands:
- name: verify-v2-science-and-release
  command: make v2-release-smoke
  output: poverty-estimate-release/v2 fixture
- name: prove-atlas-consumer-boundary
  command: make atlas-contract-smoke
  output: province_2010 synthetic consumer fixture
- name: verify-commissioning-surface
  command: make commissioning-smoke
  output: benchmark-backed commissioning smoke with capability blocking
- name: produce-legacy-v1-release
  command: PYTHONPATH=src python -m poverty_pipeline run-lock <poverty-slice-lock/v1-path>
  input: poverty-slice-lock/v1
  status: compatibility-only
generated_paths:
- build/
- artifacts/
- figures/
verification:
  status: active-v2-commissioning
  last_verified: '2026-09-26'
  command: make v2-release-smoke && make atlas-contract-smoke && make commissioning-smoke
  current_real_gates:
  - run G5 Census-target eph_agglomerate release for 2024-Q3 against exact governed parents
  - commission the Q3 full-frame -> EPH-footprint -> EPH observed/point/predictive bridge before expanding G5 longitudinally
  - expand G5/G7 to other quarters only after the Q3 bridge passes
  - supply a justified uncertainty representation before publishing uncertainty statistics
maintenance:
  cadence: active-development
